name: Electron CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    steps:
      # Pin third-party Actions to immutable commits to protect the CI supply chain.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron dependencies
        run: pnpm --dir src-electron install --frozen-lockfile

      - name: Verify fast checks
        run: pnpm verify:fast

  build-electron:
    needs: verify
    runs-on: ${{ matrix.os }}
    name: Build Electron / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm verify:build

      - name: Smoke-test packaged app
        run: pnpm smoke:packaged
        env:
          # GitHub's Linux runner cannot make Electron's chrome-sandbox helper
          # root-owned with mode 4755. This exception applies only to the
          # isolated smoke process; the packaged app remains sandboxed normally.
          FILE_EXPLORER_SMOKE_NO_SANDBOX: ${{ runner.os == 'Linux' }}
