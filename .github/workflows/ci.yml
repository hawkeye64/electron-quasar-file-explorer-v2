name: Electron CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron dependencies
        run: pnpm --dir src-electron install --frozen-lockfile

      - name: Verify fast checks
        run: pnpm verify:fast

  build-electron:
    needs: verify
    runs-on: ${{ matrix.os }}
    name: Build Electron / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm verify:build
